<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#F3F7FB" />
    <title>Offline - Gatelog</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f5f7fb;
        --ink: #0f1b2d;
        --muted: #5b6b80;
        --accent: #1f3864;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b1320;
          --ink: #e8eef7;
          --muted: #9aabc2;
          --accent: #8fb3ff;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--ink);
        font:
          16px/1.5 system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        padding: 24px;
        box-sizing: border-box;
        text-align: center;
      }
      .code {
        font:
          700 3rem/1 ui-monospace,
          'SFMono-Regular',
          Menlo,
          monospace;
        letter-spacing: 0.08em;
        color: var(--accent);
      }
      p {
        color: var(--muted);
        max-width: 32ch;
        margin: 12px auto 24px;
      }
      button {
        font: inherit;
        font-weight: 700;
        padding: 12px 20px;
        border-radius: 999px;
        border: 0;
        background: var(--accent);
        color: #fff;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="code" aria-hidden="true">OFF</div>
      <h1>Du är offline</h1>
      <p>Gatelog behöver nätverk för att hämta flöde och flygplatser. Försök igen när du har täckning.</p>
      <button type="button" id="retry">Försök igen</button>
    </main>
    <script src="/offline.js"></script>
  </body>
</html>
