name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, test och bygg
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - name: Servertester
        run: npm test -w server
      - name: Klienttester (Vitest)
        run: npm test -w client
      - name: Bygg och kontrollera storleksbudget (scripts/check-budget.mjs)
        run: npm run build
      - name: Säkerhetsgranskning av produktionsberoenden
        run: npm audit --omit=dev --audit-level=high
      # Hela trädet inklusive dev-beroenden (SEC-24). Gränsen är critical eftersom picomatch
      # (GHSA-fc5q-39xc-vjpf, ReDoS i byggverktyg) saknar rättad version; höj till high när den finns.
      - name: Säkerhetsgranskning av alla beroenden
        run: npm audit --audit-level=critical

  e2e:
    name: Playwright (Android, desktop och prestandabudget)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --project=android --project=desktop
        env:
          CI: 'true'
      - name: Prestandabudget (LCP, CLS, gilla, sidbyte vid 4x CPU)
        run: npm run test:e2e -- --project=perf --no-deps
        env:
          CI: 'true'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-resultat
          path: test-results/
          retention-days: 7
